name: Source patch checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Checker regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Publication checks (normal and optimized)
        run: |
          python tools/check_public.py
          python -O tools/check_public.py
      - name: Verify patch against pinned upstream
        run: python tools/verify_patch.py
